<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored === 'light' || stored === 'dark' ? stored : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');

footer { flex-shrink: 0; border-top: 1px solid var(--rule); padding-top: 28px; padding-bottom: 28px; }

  <div class="wrap">
    <h1>Leaders, in their words</h1>
    <p class="lede">From the leaders I’ve coached, and from the people who brought me in to work with their teams.</p>
    <figure class="testimonial" id="vatalidis">
      <blockquote><p>Paulo brought serious experience and raised the bar for our team.</p></blockquote>
      <div class="testimonial-note">
          <p>We’re running a Leadership Coaching pilot this quarter, and it’s a strong reminder of what a gift a dedicated coach is for any leader.</p>
          <p>Our goal was simple: give every Head at Todoist a space to work on their personal and team goals, while sparking more curiosity about coaching within their own leadership styles.</p>
          <p>After a decade of running growth and self-development perks, I’ve learned they are almost always the most underutilized benefits a company offers.</p>
          <p>If you have a development budget and don’t have a dedicated coach, do yourself a favor, use that perk and book a session with Paulo André.</p>
          <p>Paulo brought serious experience and raised the bar for our team. What stood out most, though, was his ability to uncover core themes while deeply understanding Todoist’s core values and how to elevate our egalitarian culture. That is what meaningful coaching looks like.</p>
          <p>Whether you’re a leader looking for a coach or a People &amp; Culture lead wanting to level up your team, Paulo André is the person to talk to.</p>
      </div>
      <figcaption><strong>Nadia Vatalidis</strong>, Head of People, Todoist · sponsor of the leadership-coaching pilot for Todoist’s Heads</figcaption>
    </figure>
    <figure class="testimonial" id="calleja">
      <blockquote><p>If you’re a leader who wants to build your own judgment rather than borrow someone else’s, I recommend working with Paulo.</p></blockquote>
      <div class="testimonial-note">
          <p>I’ve known Paulo for a long time. It started with him coaching managers who reported to me at Hotjar. Over time we connected and became friends through shared interests and values. I’m now lucky enough to be coached by him myself. That combination is rare! He knows me well enough to see my patterns, and he’s professional enough to do something useful with that knowledge.</p>
          <p>What sets Paulo apart is that he coaches rather than mentors. Instead of telling you what to do in a given situation, he helps you build the muscle to work it out yourself. He asks the question that makes you look at the situation differently, then gives you something small and concrete to try before the next session. I leave with practical actions, not just advice.</p>
          <p>He is also candid. Paulo is firmly in my corner, but he will challenge me when I’m holding myself to an outdated idea of what a leader should be, or when my self-expectations are too high. He has a wide view of what I’m capable of, and he pays close attention to the details and to how you describe situations, picking up on a lot of signals between the lines. Often, simply hearing those observations played back to me is an eye-opener that helps me connect the dots.</p>
          <p>Above all, Paulo is genuinely interested in you as a person, not only in your professional role. He is dedicated to seeing you grow into a better leader and a better human being, and it shows in how he runs his sessions, how he follows up, and how much time he gives.</p>
          <p>Our conversations leave me clearer, calmer and more honest with myself. If you’re a leader who wants to build your own judgment rather than borrow someone else’s, I recommend working with Paulo.</p>
      </div>
      <figcaption><strong>Clint Calleja</strong>, Senior Director of Engineering, Contentsquare</figcaption>
    </figure>
    <figure class="testimonial" id="vossen">
      <blockquote><p>His focus is first and foremost on me and my specific situation, and he offers suggestions only where they genuinely apply.</p></blockquote>
      <div class="testimonial-note">
          <p>I first started working with Paulo when I took on an exciting and complex new project at Spotify, as engineering director for a greenfield, yet-to-be-proven product area. Having Paulo by my side during that time was incredibly valuable. From strategic insights and org debugging to navigating complex work relationships, determining personal goals and managing my time and energy more effectively, whatever it was, he helped me grow and significantly sharpen my thinking.</p>
          <p>Paulo has tremendous knowledge, drawn from both theory and experience, and always has a relevant tool, resource or framework at hand for whatever I’ve thrown at him. Yet he doesn’t lead with it. His focus is first and foremost on me and my specific situation, and he offers suggestions only where they genuinely apply. What stood out most was his pragmatism grounded in strong values, and his systems thinking that always stays human-first. Beyond being deeply enriching, working with him has been an absolute pleasure.</p>
      </div>
      <figcaption><strong>Domenic Vossen</strong>, former Director of Engineering, Spotify</figcaption>
    </figure>
    <figure class="testimonial" id="papauschek">
      <blockquote><p>He is practical, direct, and very good at asking the questions I had been avoiding.</p></blockquote>
      <div class="testimonial-note">
          <p>I worked with Paulo for about a year while Journi’s engineering team was growing past the point where I could lead everyone directly. He helped me figure out what to let go of, define the VP Engineering role we needed, and hand over team lead positions without trying to clone myself.</p>
      </div>
      <figcaption><strong>Christian Papauschek</strong>, Co-Founder &amp; CTO, Journi</figcaption>
    </figure>
    <figure class="testimonial" id="rizwan">
      <blockquote><p>I chose management, and Paulo guided me through the transition, helping me become the leader I actually wanted to be, not just one shaped by management books.</p></blockquote>
      <div class="testimonial-note">
          <p>I worked with Paulo during my time at Hotjar, and his coaching was invaluable to my growth as a product leader. Like many people in tech, I’d hit a familiar fork in the road: remain an individual contributor, or move into management. Rather than pushing me toward one path, Paulo first helped me get clear on my “why” — and with that clarity, I could move forward with real confidence.</p>
          <p>I chose management, and Paulo guided me through the transition, helping me become the leader I actually wanted to be, not just one shaped by management books.</p>
          <p>Thanks to his guidance, I grew into an effective leader and was later promoted to Director of Product. I credit Paulo with a lot of that growth.</p>
      </div>
      <figcaption><strong>Mohammad Rizwan</strong>, former Director of Product, Hotjar / Contentsquare</figcaption>
    </figure>

<script>
(function () {
  var themeToggle = document.getElementById('theme-toggle');
  var themeColorMeta = document.getElementById('theme-color-meta');
  var THEME_COLORS = { light: '#FFFFFF', dark: '#0F141A' };
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    if (themeColorMeta) themeColorMeta.setAttribute('content', THEME_COLORS[theme]);
    if (themeToggle) themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  }
  applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
  if (themeToggle) {
    themeToggle.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  }
  if (window.matchMedia) {
    var mql = window.matchMedia('(prefers-color-scheme: dark)');
    var handler = function (e) {
      try { if (localStorage.getItem('theme')) return; } catch (err) {}
      applyTheme(e.matches ? 'dark' : 'light');
    };
    if (mql.addEventListener) mql.addEventListener('change', handler);
    else if (mql.addListener) mql.addListener(handler);
  }
})();
</script>
