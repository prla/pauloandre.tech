<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page not found</title>
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #FFFFFF;
  --ink: #1A1A1A;
  --ink-soft: #5C5C5C;
  --blue: #5384C1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1B1814;
    --ink: #ECE6D9;
    --ink-soft: #A79E8E;
    --blue: #8FB1D8;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
  font-size: 18px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
main { max-width: 32rem; }
h1 {
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 16px;
}
p { margin-bottom: 12px; }
ul { padding-left: 20px; margin-bottom: 12px; }
</style>
</head>
<body>
<main>
<h1>404 — Not found</h1>
<p>This page doesn't exist. This is a single-page site — there's nothing else under this domain.</p>
<ul>
<li><a href="/">pauloandre.tech</a> — the actual site</li>
<li><a href="/llms.txt">/llms.txt</a> — machine-readable summary</li>
</ul>
</main>
</body>
</html>
